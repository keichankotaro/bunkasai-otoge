name: Build Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build for StandaloneWindows64
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release へのアップロードに必要
    steps:
      # LFS の実ファイルが必要（ProjectSettings などが LFS 管理のため）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.37f1
          targetPlatform: StandaloneWindows64
          buildMethod: CIBuild.BuildWindows
          buildsPath: Builds

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bunkasai-otoge-windows
          path: Builds/StandaloneWindows64
          if-no-files-found: error

      # Release 配布用に zip 化する
      - name: Zip build
        run: |
          cd Builds/StandaloneWindows64
          zip -r ../../bunkasai-otoge-windows.zip .

      # タグ dev-latest の Release を作り、毎回ここへ最新ビルドを上書きする
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: 最新開発ビルド (Development Build)
          body: |
            CI が自動でビルドした最新の Windows 版 (Development Build) です。
            zip を展開して bunkasai-2023-otoge.exe を実行してください。
          prerelease: false
          files: bunkasai-otoge-windows.zip
